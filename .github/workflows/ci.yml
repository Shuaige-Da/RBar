name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\RBar.slnx

      - name: Audit NuGet dependencies
        run: dotnet list .\RBar.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build .\RBar.slnx -c Release --no-restore

      - name: Test
        run: >-
          dotnet test .\DynamicIslandBar.Tests\DynamicIslandBar.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory .\TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7
