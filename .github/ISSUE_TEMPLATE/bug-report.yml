name: 缺陷报告
description: 报告可以稳定复现的 RBar 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请移除日志和截图中的用户名、文件路径及其他个人信息。

  - type: input
    id: version
    attributes:
      label: RBar 版本
      placeholder: 例如 1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本与显示缩放
      placeholder: 例如 Windows 11 24H2，150% DPI
    validations:
      required: true

  - type: dropdown
    id: layout
    attributes:
      label: 胶囊位置
      options:
        - 顶部
        - 底部
        - 左侧
        - 右侧
        - 浮动
        - 与位置无关
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最短、可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息或截图
      description: 可粘贴“版本信息 > 诊断中心”生成的内容。请勿提交敏感数据。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题。
          required: true
        - label: 我已确认内容不包含密码、令牌或个人隐私。
          required: true
