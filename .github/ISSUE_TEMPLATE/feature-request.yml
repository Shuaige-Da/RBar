name: 功能建议
description: 提议一个清晰、可验证的新功能或体验改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前使用场景和具体痛点，而不只是解决方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 说明完成后用户应当能做什么。
    validations:
      required: true
